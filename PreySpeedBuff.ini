; PreySpeedBuff 1.0.0 configuration
; The ASI reads this file from its own directory on every game launch. Invalid
; or unknown entries keep the plugin inert and are reported in PreySpeedBuff.log.

[speed]
enabled = true
; Player speed in game units per second, from 0 to 100000. Use "game" to keep
; the value the game itself would use. The single-player retail values are
; walk 180, run 220, and crouch 80, so these defaults are 1.5x retail.
;
; walk is the speed you normally move at. The game binds no run key by default,
; so run only matters if you bind one, for example with this console command:
;     bind "CTRL" "_speed"
; Retail stamina still fades run back to walk as it runs out.
walk = 270
run = 330
crouch = 120
